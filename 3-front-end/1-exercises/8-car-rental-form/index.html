<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car Rental</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="style.css" />

    <style>
      body {
        background-image: url("images/orange-background.png");
        background-size: 100% 100%;
        min-height: 100vh;
        color: rgb(80, 0, 80);
        font-size: 18px;
        font-weight: 600;
      }

      form {
        width: 550px;
      }

      input[type="date"],
      ::placeholder,
      .form-select {
        color: rgb(80, 0, 80);
      }
      input[type="checkbox"]:checked {
        background-color: rgb(80, 0, 80);
      }

      ::-webkit-calendar-picker-indicator {
        filter: invert(11%) sepia(84%) saturate(4059%) hue-rotate(287deg)
          brightness(81%) contrast(116%);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header></header>
    <main class="d-flex justify-content-center align-items-center vh-100">
      <form class="bg-light rounded-5 p-5">
        <h2 class="fw-bold mb-5">Search for a rental car</h2>

        <div class="mb-2">
          <label for="exampleInputLocation" class="form-label"
            >Pick up location</label
          >
          <input
            type="text"
            class="form-control form-control-lg"
            id="exampleInputLocation"
            placeholder="City, airport, region, district..."
          />
        </div>

        <div class="mb-4 form-check">
          <input type="checkbox" class="form-check-input" id="deliver-car" />
          <label class="form-check-label fw-normal" for="deliver-car"
            >Deliver the car somewhere else</label
          >
        </div>

        <div class="row mb-3">
          <div class="col">
            <label for="pickup">Date of pickup</label>
            <input
              type="date"
              class="form-control form-control-lg"
              id="pickup"
            />
          </div>
          <div class="col">
            <label for="delivery">Date of delivery</label>
            <input
              type="date"
              class="form-control form-control-lg"
              id="delivery"
            />
          </div>
        </div>

        <div class="row mb-3">
          <div class="col">
            <select class="form-select form-select-lg">
              <option value="0">0</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
              <option value="11">11</option>
              <option value="12">12</option>
              <option value="13">13</option>
              <option value="14">14</option>
              <option value="15">15</option>
              <option value="16">16</option>
              <option value="17">17</option>
              <option value="18">18</option>
              <option value="19">19</option>
              <option value="20">20</option>
              <option value="21">21</option>
              <option value="22">22</option>
              <option value="23">23</option>
            </select>
          </div>
          <div class="col">
            <select class="form-select form-select-lg">
              <option value="00">00</option>
              <option value="15">15</option>
              <option value="30">30</option>
              <option value="45">45</option>
            </select>
          </div>
          <div class="col">
            <select class="form-select form-select-lg">
              <option value="0">0</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
              <option value="11">11</option>
              <option value="12">12</option>
              <option value="13">13</option>
              <option value="14">14</option>
              <option value="15">15</option>
              <option value="16">16</option>
              <option value="17">17</option>
              <option value="18">18</option>
              <option value="19">19</option>
              <option value="20">20</option>
              <option value="21">21</option>
              <option value="22">22</option>
              <option value="23">23</option>
            </select>
          </div>
          <div class="col">
            <select class="form-select form-select-lg">
              <option value="00">00</option>
              <option value="15">15</option>
              <option value="30">30</option>
              <option value="45">45</option>
            </select>
          </div>
        </div>

        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="is-age-valid" />
          <label class="form-check-label fw-normal" for="is-age-valid"
            >The driver's age between 30 and 65?
            <span class="text-secondary fs-5">ⓘ</span>
          </label>
        </div>

        <p class="mb-2">✓ No credit card fees</p>
        <p class="mb-2">✓ No change fees</p>
        <p class="mb-2">✓ price match gurantee</p>

        <button
          type="submit"
          class="btn w-100 rounded-5 text-light fs-5 mt-3 p-3 fw-bold"
          style="background-color: rgb(255, 17, 0)"
        >
          Search
        </button>
      </form>
    </main>
    <footer></footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
