<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Grade Manager</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Student Grade Manager</h1>

      <!-- Add Student -->
      <from class="form">
        <div>
          <label for="nameInput">Student Name</label>
          <input
            type="text"
            id="nameInput"
            placeholder="Enter student name"
            required
            pattern="[A-Za-z\s]+"
          />
          <div id="nameError"></div>
        </div>

        <div>
          <label for="scoreInput">Score</label>
          <input
            type="number"
            id="scoreInput"
            placeholder="Enter score"
            min="0"
            max="100"
            required
          />
          <div id="scoreError"></div>
        </div>

        <button id="addBtn">Add Student</button>
      </from>
      <label for="search">Search</label>
      <div class="searchNClear">
        <input
          type="text"
          id="search"
          placeholder="Search for student name"
          pattern="[A-Za-z\s]+"
        />
        <button id="clearBtn">Clear Students</button>
      </div>
      <!-- Students Table -->
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Score</th>
            <th>Grade</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="tbody"></tbody>
      </table>
      <div id="tableEmpty">The are no students to show</div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
